<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web CRUD Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-container">
        <section class="card">
            <div class="tabs">
                <button type="button" id="tabLogin" class="tab-btn active">Login</button>
                <button type="button" id="tabRegister" class="tab-btn">Buat Akun</button>
            </div>

            <h1 id="authHeading">Login</h1>
            <div id="authStatus" class="status hidden" role="alert"></div>

            <form id="authForm">
                <div class="form-group">
                    <label for="identifier">ID atau Email</label>
                    <input
                        id="identifier"
                        name="identifier"
                        type="text"
                        placeholder="contoh: johndoe@gmail.com atau johndoe"
                        maxlength="254"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <button type="submit" id="authSubmitBtn" class="btn btn-primary btn-full">Masuk</button>
            </form>

            <p id="authNote" class="note">
                Belum punya akun? Klik tab <strong>Buat Akun</strong> di atas untuk mendaftar terlebih dahulu.
            </p>
        </section>
    </main>

    <script>
        const tabLogin = document.getElementById("tabLogin");
        const tabRegister = document.getElementById("tabRegister");
        const authHeading = document.getElementById("authHeading");
        const authStatus = document.getElementById("authStatus");
        const authForm = document.getElementById("authForm");
        const identifierInput = document.getElementById("identifier");
        const passwordInput = document.getElementById("password");
        const authSubmitBtn = document.getElementById("authSubmitBtn");
        const authNote = document.getElementById("authNote");

        let mode = "login";

        function showStatus(type, message) {
            authStatus.textContent = message;
            authStatus.className = "status " + type;
        }

        function clearStatus() {
            authStatus.textContent = "";
            authStatus.className = "status hidden";
        }

        function setMode(nextMode, keepStatus = false) {
            mode = nextMode;
            if (!keepStatus) {
                clearStatus();
            }

            const isLogin = mode === "login";
            tabLogin.classList.toggle("active", isLogin);
            tabRegister.classList.toggle("active", !isLogin);
            authHeading.textContent = isLogin ? "Login" : "Buat Akun Baru";
            authSubmitBtn.textContent = isLogin ? "Masuk" : "Buat Akun";
            authNote.textContent = isLogin
                ? "Belum punya akun? Klik tab Buat Akun di atas untuk mendaftar terlebih dahulu."
                : "Sudah punya akun? Klik tab Login di atas untuk masuk.";
        }

        async function checkExistingSession() {
            try {
                const res = await fetch("api.php?action=me");
                if (res.ok) {
                    window.location.replace("dashboard.html");
                }
            } catch {
                // Tetap di halaman login jika server belum merespons
            }
        }

        tabLogin.addEventListener("click", () => setMode("login"));
        tabRegister.addEventListener("click", () => setMode("register"));

        authForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            clearStatus();

            const identifier = identifierInput.value.trim();
            const password = passwordInput.value;
            const endpoint = mode === "login" ? "api.php?action=login" : "api.php?action=create";

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identifier, password }),
                });
                const data = await res.json();

                if (!res.ok) {
                    showStatus("err", data.error || "Proses gagal.");
                    return;
                }

                if (mode === "login") {
                    window.location.replace("dashboard.html");
                    return;
                }

                passwordInput.value = "";
                setMode("login", true);
                showStatus("ok", "Akun berhasil dibuat. Silakan login.");
                passwordInput.focus();
            } catch {
                showStatus("err", "Gagal terhubung ke server PHP/XAMPP.");
            }
        });

        checkExistingSession();
    </script>
</body>
</html>
